<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Card</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", system-ui, sans-serif;
    }

    .body {
      
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 0px;
      width:fit-content;
      border:1px solid black;
    }

    .card {
      position: relative;
      width: 360px;
      background: #ffffff;
      border-radius: 0px;
      /* box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15); */
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.2);
    } */

    .card-cover {
      position: relative;
      height: 180px;
      overflow: hidden;
    }

    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-header {
      padding: 20px 24px;
      background: #ffffff;
      border-bottom: 1px solid #f0f0f0;
    }

    .card-header h2 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      font-weight: 600;
      color: #111;
    }

    .card-header p {
      margin: 0;
      font-size: 0.95rem;
      color: #666;
    }

    .card-header h2 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .card-header p {
      margin: 0;
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .card-body {
      padding: 22px 24px 26px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.95rem;
      color: #dddbdb;
      width: 150px;
    }

    .info-row span {
      font-weight: 500;
      color: #f8f3f3;
    }

    .progress {
      margin-top: 18px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #d2cece;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #eaeaea;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      border-radius: 20px;
    }


    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.25s ease, transform 0.2s ease;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

  </style>
</head>
<body>
<div class="body">
  <div class="card">
    <div class="card-cover">
      <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=900&q=80" alt="Event cover" />
    </div>

    <div class="card-header">
      <h2>lkhk;</h2>
      <p>📍 m mnn</p>
    </div>
  </div>
